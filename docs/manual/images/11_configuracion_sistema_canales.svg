<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 580" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="sysSh" x="-2%" y="-2%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1024" height="580" fill="#f8fafc"/>

  <!-- Main Container -->
  <g transform="translate(30, 20)" filter="url(#sysSh)">
    <rect width="964" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Header -->
    <g transform="translate(24, 24)">
      <text font-size="16" font-weight="800" fill="#1e293b" letter-spacing="0.5">CANALES Y NOTIFICACIONES DEL SISTEMA</text>
      <text y="18" font-size="11" fill="#64748b">Configuración global de despacho de alertas por Email y SMS con plantillas dinámicas</text>
    </g>

    <!-- Global Parameters Box -->
    <g transform="translate(24, 70)">
      <rect width="916" height="66" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
      
      <!-- Frecuencia correos -->
      <g transform="translate(20, 12)">
        <text font-size="10.5" font-weight="800" fill="#312e81">FRECUENCIA DE ENVÍO DE CORREOS</text>
        <g transform="translate(0, 16)">
          <rect width="70" height="26" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
          <text x="35" y="17" font-size="11" font-weight="800" fill="#4338ca" text-anchor="middle">1</text>
          <text x="78" y="17" font-size="10" font-weight="600" fill="#4338ca">minuto(s) para recalcular</text>
        </g>
      </g>

      <!-- Email por defecto -->
      <g transform="translate(460, 12)">
        <text font-size="10.5" font-weight="800" fill="#312e81">CORREO POR DEFECTO DEL SISTEMA (COPIA AUDITORA)</text>
        <g transform="translate(0, 16)">
          <rect width="360" height="26" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
          <text x="12" y="17" font-size="10.5" fill="#1e293b">soporte.freezerguard@gmail.com</text>
        </g>
      </g>
    </g>

    <!-- Two Channels: Email vs SMS -->
    <g transform="translate(24, 150)">
      
      <!-- CHANNEL 1: CORREO ELECTRÓNICO (EMAIL) -->
      <g filter="url(#sysSh)">
        <rect width="446" height="240" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
        
        <!-- Header -->
        <g transform="translate(16, 16)">
          <circle cx="10" cy="10" r="10" fill="#dbeafe"/>
          <!-- Mail icon -->
          <rect x="5" y="6" width="10" height="8" rx="1.5" stroke="#2563eb" stroke-width="1.2" fill="none"/>
          <path d="M5 7 l5 4 l5 -4" stroke="#2563eb" stroke-width="1.2" fill="none"/>
          <text x="26" y="14" font-size="12" font-weight="800" fill="#1e3a8a">CANAL CORREO ELECTRÓNICO</text>

          <!-- Toggle Activar Correos -->
          <g transform="translate(280, 0)">
            <rect width="124" height="22" rx="5" fill="#ffffff" stroke="#93c5fd"/>
            <rect x="4" y="4" width="14" height="14" rx="3" fill="#2563eb"/>
            <path d="M7 11 l2 2 l4 -4" stroke="#ffffff" stroke-width="1.5" fill="none"/>
            <text x="24" y="15" font-size="10" font-weight="700" fill="#1d4ed8">Activar correos</text>
          </g>
        </g>

        <!-- Asunto Input -->
        <g transform="translate(16, 50)">
          <text font-size="10" font-weight="700" fill="#1e40af">Asunto del correo</text>
          <rect y="6" width="414" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/>
          <text x="10" y="24" font-size="10.5" font-weight="600" fill="#1e293b">¡Alerta Crítica! - FreezerGuard ({dispositivo})</text>
        </g>

        <!-- Cuerpo Textarea -->
        <g transform="translate(16, 110)">
          <text font-size="10" font-weight="700" fill="#1e40af">Cuerpo del correo (Plantilla HTML/Texto)</text>
          <rect y="6" width="414" height="100" rx="6" fill="#ffffff" stroke="#93c5fd"/>
          <text x="10" y="24" font-size="10" font-family="monospace" fill="#334155">Se ha detectado una anomalía crítica en el equipo.</text>
          <text x="10" y="40" font-size="10" font-family="monospace" fill="#2563eb">Tipo: {tipo_alerta} en {dispositivo} ({freezer})</text>
          <text x="10" y="56" font-size="10" font-family="monospace" fill="#2563eb">Temperatura registrada: {temperatura} °C</text>
          <text x="10" y="72" font-size="10" font-family="monospace" fill="#2563eb">Fecha y Hora: {fecha}</text>
          <text x="10" y="88" font-size="9.5" font-family="monospace" fill="#64748b">[Haga clic aquí para resolver la alerta en el portal]</text>
        </g>
      </g>

      <!-- CHANNEL 2: MENSAJES DE TEXTO (SMS) -->
      <g transform="translate(470, 0)" filter="url(#sysSh)">
        <rect width="446" height="240" rx="12" fill="#faf5ff" stroke="#e9d5ff"/>
        
        <!-- Header -->
        <g transform="translate(16, 16)">
          <circle cx="10" cy="10" r="10" fill="#f3e8ff"/>
          <!-- MessageSquare icon -->
          <path d="M5 6 h10 a2 2 0 0 1 2 2 v6 a2 2 0 0 1 -2 2 h-4 l-4 3 v-3 h-2 a2 2 0 0 1 -2 -2 v-6 a2 2 0 0 1 2 -2 z" stroke="#9333ea" stroke-width="1.2" fill="none"/>
          <text x="26" y="14" font-size="12" font-weight="800" fill="#581c87">CANAL MENSAJES SMS</text>

          <!-- Button Probar SMS -->
          <g transform="translate(190, 0)">
            <rect width="100" height="22" rx="5" fill="#f3e8ff" stroke="#d8b4fe"/>
            <!-- Send icon -->
            <path d="M8 11 l8 -4 l-4 8 l-2 -3 z" fill="#7e22ce"/>
            <text x="26" y="15" font-size="10" font-weight="800" fill="#6b21a8">Probar SMS</text>
          </g>

          <!-- Toggle Activar SMS -->
          <g transform="translate(300, 0)">
            <rect width="104" height="22" rx="5" fill="#ffffff" stroke="#d8b4fe"/>
            <rect x="4" y="4" width="14" height="14" rx="3" fill="#9333ea"/>
            <path d="M7 11 l2 2 l4 -4" stroke="#ffffff" stroke-width="1.5" fill="none"/>
            <text x="24" y="15" font-size="10" font-weight="700" fill="#7e22ce">Activar SMS</text>
          </g>
        </g>

        <!-- Mensaje SMS Textarea -->
        <g transform="translate(16, 50)">
          <text font-size="10" font-weight="700" fill="#6b21a8">Mensaje SMS de Alerta (Optimizado para GSM)</text>
          <rect y="6" width="414" height="120" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
          <text x="10" y="24" font-size="10" font-family="monospace" fill="#1e293b">ALERTA FREEZERGUARD:</text>
          <text x="10" y="40" font-size="10" font-family="monospace" fill="#7e22ce">Se detectó {tipo_alerta} en {dispositivo}.</text>
          <text x="10" y="56" font-size="10" font-family="monospace" fill="#7e22ce">Temp: {temperatura} C. Fecha: {fecha}</text>
          <text x="10" y="72" font-size="9" fill="#9333ea">Límite SMS: 160 caracteres estándar.</text>
        </g>

        <text x="16" y="210" font-size="9.5" fill="#7e22ce">El SMS de restauración se envía automáticamente al normalizarse.</text>
      </g>
    </g>

    <!-- Dynamic Variables Reference Bar -->
    <g transform="translate(24, 405)">
      <rect width="916" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="14" y="25" font-size="10.5" font-weight="800" fill="#334155">VARIABLES DISPONIBLES:</text>
      
      <g transform="translate(170, 8)">
        <rect width="94" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="47" y="16" font-size="10" font-family="monospace" font-weight="700" fill="#4338ca" text-anchor="middle">{dispositivo}</text>
      </g>
      <g transform="translate(272, 8)">
        <rect width="76" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="38" y="16" font-size="10" font-family="monospace" font-weight="700" fill="#4338ca" text-anchor="middle">{freezer}</text>
      </g>
      <g transform="translate(356, 8)">
        <rect width="94" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="47" y="16" font-size="10" font-family="monospace" font-weight="700" fill="#4338ca" text-anchor="middle">{tipo_alerta}</text>
      </g>
      <g transform="translate(458, 8)">
        <rect width="104" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="52" y="16" font-size="10" font-family="monospace" font-weight="700" fill="#4338ca" text-anchor="middle">{temperatura}</text>
      </g>
      <g transform="translate(570, 8)">
        <rect width="66" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="33" y="16" font-size="10" font-family="monospace" font-weight="700" fill="#4338ca" text-anchor="middle">{fecha}</text>
      </g>
    </g>

    <!-- Save Button -->
    <g transform="translate(730, 475)">
      <rect width="210" height="38" rx="8" fill="#4f46e5"/>
      <text x="105" y="24" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">GUARDAR CONFIGURACIÓN</text>
    </g>
  </g>
</svg>
