<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cfgSh" x="-2%" y="-2%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="1024" height="640" fill="#f8fafc"/>

  <!-- Left Side: Table of Devices (Background Preview) -->
  <g transform="translate(30, 20)">
    <text font-size="16" font-weight="800" fill="#1e293b" letter-spacing="0.5">DISPOSITIVOS HARDWARE (ESP32)</text>
    <text y="18" font-size="11" fill="#64748b">Asociación entre placas IoT embebidas y freezers de laboratorio</text>

    <!-- Mini Devices Table Preview -->
    <g transform="translate(0, 36)">
      <rect width="420" height="200" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <rect width="420" height="34" rx="12" fill="#f1f5f9"/>
      <rect y="24" width="420" height="10" fill="#f1f5f9"/>
      <text x="14" y="21" font-size="10" font-weight="800" fill="#475569">DISPOSITIVO</text>
      <text x="160" y="21" font-size="10" font-weight="800" fill="#475569">LABORATORIO</text>
      <text x="360" y="21" font-size="10" font-weight="800" fill="#475569" text-anchor="end">ACCIÓN</text>

      <!-- Row 1 -->
      <g transform="translate(0, 34)">
        <text x="14" y="24" font-size="11" font-weight="700" fill="#1e293b">ESP32 Lab Central</text>
        <text x="160" y="24" font-size="11" fill="#475569">Freezer Lab 1</text>
        <!-- Settings button -->
        <g transform="translate(350, 10)">
          <rect width="24" height="24" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
          <circle cx="12" cy="12" r="5" stroke="#4f46e5" stroke-width="1.3" fill="none"/>
        </g>
        <line x1="0" y1="42" x2="420" y2="42" stroke="#f1f5f9"/>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 76)">
        <text x="14" y="24" font-size="11" font-weight="700" fill="#1e293b">ESP32 Lab Bioquímica</text>
        <text x="160" y="24" font-size="11" fill="#475569">Freezer Lab 2</text>
        <g transform="translate(350, 10)">
          <rect width="24" height="24" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
          <circle cx="12" cy="12" r="5" stroke="#4f46e5" stroke-width="1.3" fill="none"/>
        </g>
      </g>
    </g>

    <!-- Guidance Note -->
    <g transform="translate(0, 260)">
      <rect width="420" height="90" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
      <text x="16" y="24" font-size="11" font-weight="800" fill="#3730a3">¿Qué parámetros controla el ESP32?</text>
      <text x="16" y="42" font-size="10.5" fill="#4338ca">• <tspan font-weight="700">Frecuencia de telemetría:</tspan> intervalo de envío de datos vía WiFi/MQTT.</text>
      <text x="16" y="58" font-size="10.5" fill="#4338ca">• <tspan font-weight="700">Módem GSM (SIM800L):</tspan> números a los que llamará o mandará SMS.</text>
      <text x="16" y="74" font-size="10.5" fill="#4338ca">• <tspan font-weight="700">Disparadores locales:</tspan> corte de luz o temperatura extrema.</text>
    </g>
  </g>

  <!-- Right Side / Modal View: EditDispositivoModal -->
  <g transform="translate(480, 20)" filter="url(#cfgSh)">
    <rect width="514" height="600" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Modal Header -->
    <g transform="translate(20, 20)">
      <circle cx="12" cy="12" r="12" fill="#e0e7ff"/>
      <circle cx="12" cy="12" r="6" stroke="#4f46e5" stroke-width="2" fill="none"/>
      <text x="32" y="16" font-size="13" font-weight="800" fill="#1e293b">CONFIGURACIÓN DE DISPOSITIVO: <tspan fill="#4f46e5">ESP32 Lab Central</tspan></text>
    </g>
    <line x1="0" y1="56" x2="514" y2="56" stroke="#e2e8f0"/>

    <!-- Section 1: Datos Principales -->
    <g transform="translate(20, 70)">
      <rect width="474" height="88" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="18" font-size="10.5" font-weight="800" fill="#334155">DATOS PRINCIPALES Y TELEMETRÍA</text>

      <!-- Input Nombre -->
      <g transform="translate(12, 28)">
        <text font-size="9.5" font-weight="600" fill="#475569">Nombre</text>
        <rect y="6" width="180" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="8" y="24" font-size="10.5" fill="#1e293b">ESP32 Lab Central</text>
      </g>

      <!-- Input Intervalo Telemetría -->
      <g transform="translate(210, 28)">
        <text font-size="9.5" font-weight="600" fill="#475569">Envío Telemetría (Segundos)</text>
        <rect y="6" width="120" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="8" y="24" font-size="11" font-weight="700" fill="#4f46e5" font-family="monospace">5</text>
        <text x="30" y="24" font-size="10" fill="#64748b">segundos</text>
      </g>
    </g>

    <!-- Section 2: Configuración SMS -->
    <g transform="translate(20, 170)">
      <rect width="474" height="74" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
      <text x="12" y="18" font-size="10.5" font-weight="800" fill="#6b21a8">NÚMEROS DE TELÉFONO PARA ALERTAS SMS</text>

      <g transform="translate(12, 26)">
        <rect width="450" height="28" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
        <text x="10" y="18" font-size="10.5" font-family="monospace" fill="#1e293b">+59898485023, +59899123456</text>
        <text y="38" font-size="9" fill="#7e22ce">Separa múltiples números telefónicos de guardia con comas</text>
      </g>
    </g>

    <!-- Section 3: Control de Alertas (Toggles) -->
    <g transform="translate(20, 256)">
      <rect width="474" height="180" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
      <text x="12" y="18" font-size="10.5" font-weight="800" fill="#6b21a8">ESTADO DE DISPARADORES DE ALERTA</text>

      <!-- Checkbox 1 -->
      <g transform="translate(14, 32)">
        <rect width="14" height="14" rx="3" fill="#4f46e5"/>
        <path d="M3 7 l3 3 l5 -5" stroke="#ffffff" stroke-width="1.8" fill="none"/>
        <text x="22" y="12" font-size="10.5" font-weight="600" fill="#1e293b">Temperatura Fuera de Rango</text>
      </g>

      <!-- Checkbox 2 -->
      <g transform="translate(14, 56)">
        <rect width="14" height="14" rx="3" fill="#4f46e5"/>
        <path d="M3 7 l3 3 l5 -5" stroke="#ffffff" stroke-width="1.8" fill="none"/>
        <text x="22" y="12" font-size="10.5" font-weight="600" fill="#1e293b">Corte de Energía Eléctrica (Suministro 220V)</text>
      </g>

      <!-- Checkbox 3 -->
      <g transform="translate(14, 80)">
        <rect width="14" height="14" rx="3" fill="#4f46e5"/>
        <path d="M3 7 l3 3 l5 -5" stroke="#ffffff" stroke-width="1.8" fill="none"/>
        <text x="22" y="12" font-size="10.5" font-weight="600" fill="#1e293b">Vencimiento de Muestra Almacenada</text>
      </g>

      <!-- Checkbox 4 (Inactividad + Minutos) -->
      <g transform="translate(14, 104)">
        <rect width="14" height="14" rx="3" fill="#4f46e5"/>
        <path d="M3 7 l3 3 l5 -5" stroke="#ffffff" stroke-width="1.8" fill="none"/>
        <text x="22" y="12" font-size="10.5" font-weight="600" fill="#1e293b">Inactividad sin telemetría (Pérdida de señal)</text>
        
        <!-- Minutos Input -->
        <g transform="translate(340, -4)">
          <text font-size="9.5" fill="#64748b">Límite:</text>
          <rect x="36" width="40" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="56" y="15" font-size="10.5" font-weight="700" fill="#4f46e5" text-anchor="middle">30</text>
          <text x="80" y="15" font-size="9.5" fill="#64748b">min</text>
        </g>
      </g>

      <!-- Checkbox 5 -->
      <g transform="translate(14, 134)">
        <rect width="14" height="14" rx="3" fill="#4f46e5"/>
        <path d="M3 7 l3 3 l5 -5" stroke="#ffffff" stroke-width="1.8" fill="none"/>
        <text x="22" y="12" font-size="10.5" font-weight="600" fill="#1e293b">Fallo en módulo SMS / Antena GSM</text>
      </g>
    </g>

    <!-- Section 4: Rangos por Defecto -->
    <g transform="translate(20, 446)">
      <rect width="474" height="80" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="12" y="18" font-size="10.5" font-weight="800" fill="#1d4ed8">RANGOS TÉRMICOS POR DEFECTO</text>
      <text x="12" y="32" font-size="9" fill="#2563eb">Aplicados cuando el freezer no posee muestras activas específicas</text>

      <g transform="translate(12, 42)">
        <text font-size="9.5" font-weight="600" fill="#1e293b">Mínima: <tspan font-family="monospace" font-weight="700">-25.0 °C</tspan></text>
        <text x="200" font-size="9.5" font-weight="600" fill="#1e293b">Máxima: <tspan font-family="monospace" font-weight="700">-10.0 °C</tspan></text>
      </g>
    </g>

    <!-- Modal Footer Buttons -->
    <g transform="translate(20, 546)">
      <rect x="230" width="80" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="270" y="21" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Cancelar</text>

      <rect x="320" width="174" height="34" rx="8" fill="#4f46e5"/>
      <text x="407" y="21" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">GUARDAR CONFIGURACIÓN</text>
    </g>
  </g>
</svg>
