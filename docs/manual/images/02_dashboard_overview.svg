<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="100%" height="100%" style="background:#f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="640" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Sidebar Header -->
  <g transform="translate(18, 22)">
    <rect width="32" height="32" rx="8" fill="#4f46e5"/>
    <path d="M16 6 L16 26 M9 10 L16 16 L23 10 M9 22 L16 16 L23 22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="42" y="22" font-size="16" font-weight="700" fill="#0f172a">FreezerGuard</text>
  </g>
  <line x1="0" y1="65" x2="220" y2="65" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- Nav Items -->
  <g transform="translate(12, 80)">
    <!-- Active: Resumen -->
    <rect x="0" y="0" width="196" height="38" rx="8" fill="#eef2ff"/>
    <rect x="0" y="0" width="4" height="38" rx="2" fill="#4f46e5"/>
    <circle cx="22" cy="19" r="6" fill="#4f46e5"/>
    <text x="38" y="24" font-size="13" font-weight="700" fill="#4338ca">Resumen</text>

    <!-- Item: Alertas -->
    <g transform="translate(0, 46)">
      <circle cx="22" cy="19" r="6" fill="#94a3b8"/>
      <text x="38" y="24" font-size="13" font-weight="500" fill="#475569">Alertas</text>
      <rect x="156" y="10" width="24" height="18" rx="9" fill="#ef4444"/>
      <text x="168" y="23" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    </g>

    <!-- Item: Mediciones -->
    <g transform="translate(0, 92)">
      <circle cx="22" cy="19" r="6" fill="#94a3b8"/>
      <text x="38" y="24" font-size="13" font-weight="500" fill="#475569">Mediciones</text>
    </g>

    <!-- Item: Muestras -->
    <g transform="translate(0, 138)">
      <circle cx="22" cy="19" r="6" fill="#94a3b8"/>
      <text x="38" y="24" font-size="13" font-weight="500" fill="#475569">Muestras</text>
    </g>

    <!-- Admin Section -->
    <text x="12" y="200" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">ADMINISTRACIÓN</text>
    
    <!-- Item: Configuración -->
    <g transform="translate(0, 210)">
      <circle cx="22" cy="19" r="6" fill="#94a3b8"/>
      <text x="38" y="24" font-size="13" font-weight="500" fill="#475569">Configuración</text>
    </g>

    <!-- Item: Usuarios -->
    <g transform="translate(0, 256)">
      <circle cx="22" cy="19" r="6" fill="#94a3b8"/>
      <text x="38" y="24" font-size="13" font-weight="500" fill="#475569">Usuarios</text>
    </g>
  </g>

  <!-- Sidebar Footer -->
  <line x1="0" y1="560" x2="220" y2="560" stroke="#f1f5f9" stroke-width="1.5"/>
  <g transform="translate(20, 580)">
    <circle cx="16" cy="16" r="16" fill="#e0e7ff"/>
    <text x="16" y="21" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="middle">MP</text>
    <text x="42" y="15" font-size="12" font-weight="600" fill="#1e293b">Matías P.</text>
    <text x="42" y="28" font-size="10" fill="#64748b">Cerrar Sesión</text>
  </g>

  <!-- Main Content Area -->
  <!-- Top Header Bar -->
  <rect x="220" y="0" width="804" height="65" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="248" y="38" font-size="15" font-weight="800" fill="#1e293b" letter-spacing="0.5">PANEL DE CONTROL PRINCIPAL</text>
  <rect x="880" y="18" width="120" height="30" rx="15" fill="#10b981" fill-opacity="0.1"/>
  <circle cx="896" cy="33" r="4" fill="#10b981"/>
  <text x="906" y="37" font-size="11" font-weight="700" fill="#047857">Telemetría OK</text>

  <!-- Dashboard Container -->
  <g transform="translate(244, 80)">
    
    <!-- Global Device Selector Banner -->
    <g filter="url(#cardShadow)">
      <rect x="0" y="0" width="756" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="12" y="10" width="32" height="32" rx="8" fill="#eef2ff"/>
      <!-- Chip icon -->
      <path d="M22 20 h12 v12 h-12 z M24 16 v4 M32 16 v4 M24 32 v4 M32 32 v4 M18 22 h4 M18 30 h4 M34 22 h4 M34 30 h4" stroke="#4f46e5" stroke-width="1.5" fill="none"/>
      <text x="54" y="24" font-size="12" font-weight="800" fill="#1e293b">INSPECCIONANDO: ESP32 LAB CENTRAL (FREEZER LAB 1)</text>
      <text x="54" y="38" font-size="10" fill="#64748b">Filtrando tarjetas, gráfico en tiempo real, muestras y alertas por este equipo</text>

      <!-- Selector Dropdown -->
      <rect x="520" y="10" width="224" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="532" y="30" font-size="11" font-weight="700" fill="#1e293b">ESP32 Lab Central (Freezer 1)</text>
      <path d="M724 24 L729 29 L734 24" stroke="#64748b" stroke-width="1.8" fill="none"/>
    </g>

    <!-- Top 3 Metric Cards -->
    <g transform="translate(0, 64)">
      <!-- Card 1: Temperatura -->
      <g filter="url(#cardShadow)">
        <rect x="0" y="0" width="242" height="96" rx="12" fill="#2563eb"/>
        <text x="14" y="24" font-size="10" font-weight="800" fill="#dbeafe" letter-spacing="1">TEMPERATURA ACTUAL</text>
        <text x="14" y="64" font-size="28" font-weight="900" fill="#ffffff" font-family="monospace">-21.40 °C</text>
        <text x="14" y="82" font-size="10" font-weight="600" fill="#bfdbfe">Sensor PT100 • ESP32 Lab Central</text>
      </g>

      <!-- Card 2: Corriente Eléctrica -->
      <g transform="translate(257, 0)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="242" height="96" rx="12" fill="#059669"/>
        <text x="14" y="24" font-size="10" font-weight="800" fill="#d1fae5" letter-spacing="1">CORRIENTE ELÉCTRICA</text>
        <text x="14" y="64" font-size="28" font-weight="900" fill="#ffffff">OK</text>
        <text x="14" y="82" font-size="10" font-weight="600" fill="#a7f3d0">Red Eléctrica 220V Activa (Sin Corte)</text>
      </g>

      <!-- Card 3: Canales y Alertas Web -->
      <g transform="translate(514, 0)" filter="url(#cardShadow)">
        <rect x="0" y="0" width="242" height="96" rx="12" fill="#0f172a"/>
        <text x="14" y="22" font-size="10" font-weight="800" fill="#94a3b8" letter-spacing="0.5">CANALES Y ALERTAS WEB</text>
        
        <!-- Badges Email & SMS -->
        <g transform="translate(14, 32)">
          <rect x="0" y="0" width="102" height="18" rx="4" fill="#4f46e5"/>
          <text x="51" y="13" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">EMAIL: ACTIVO</text>

          <rect x="110" y="0" width="102" height="18" rx="4" fill="#9333ea"/>
          <text x="161" y="13" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">SMS: ACTIVO</text>
        </g>

        <!-- Triggers Grid -->
        <g transform="translate(14, 60)">
          <rect x="0" y="0" width="40" height="16" rx="3" fill="#10b981" fill-opacity="0.2"/>
          <text x="20" y="12" font-size="8.5" font-weight="700" fill="#34d399" text-anchor="middle">Temp: ON</text>

          <rect x="43" y="0" width="38" height="16" rx="3" fill="#10b981" fill-opacity="0.2"/>
          <text x="62" y="12" font-size="8.5" font-weight="700" fill="#34d399" text-anchor="middle">Bat: ON</text>

          <rect x="84" y="0" width="42" height="16" rx="3" fill="#10b981" fill-opacity="0.2"/>
          <text x="105" y="12" font-size="8.5" font-weight="700" fill="#34d399" text-anchor="middle">Venc: ON</text>

          <rect x="129" y="0" width="42" height="16" rx="3" fill="#10b981" fill-opacity="0.2"/>
          <text x="150" y="12" font-size="8.5" font-weight="700" fill="#34d399" text-anchor="middle">Inact: ON</text>

          <rect x="174" y="0" width="40" height="16" rx="3" fill="#10b981" fill-opacity="0.2"/>
          <text x="194" y="12" font-size="8.5" font-weight="700" fill="#34d399" text-anchor="middle">GSM: ON</text>
        </g>
      </g>
    </g>

    <!-- Realtime Chart Section Card -->
    <g transform="translate(0, 172)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="756" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      
      <!-- Chart Header -->
      <text x="18" y="24" font-size="12" font-weight="800" fill="#0f172a">MONITOREO DE TEMPERATURA EN TIEMPO REAL</text>
      
      <!-- Range Selector Buttons -->
      <g transform="translate(480, 10)">
        <rect x="0" y="0" width="220" height="24" rx="6" fill="#e2e8f0"/>
        <rect x="2" y="2" width="68" height="20" rx="4" fill="#ffffff"/>
        <text x="36" y="16" font-size="10" font-weight="700" fill="#4338ca" text-anchor="middle">Últimos 5</text>
        <text x="110" y="16" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Últimos 30</text>
        <text x="182" y="16" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Últimos 100</text>
      </g>
      <line x1="0" y1="42" x2="756" y2="42" stroke="#f1f5f9"/>

      <!-- Device Visibility Toggles -->
      <g transform="translate(18, 52)">
        <text x="0" y="14" font-size="10" font-weight="700" fill="#475569">Visibilidad:</text>
        <rect x="70" y="2" width="130" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
        <circle cx="82" cy="11" r="3" fill="#3b82f6"/>
        <text x="92" y="14" font-size="9" font-weight="700" fill="#1e293b">ESP32 Lab Central</text>

        <rect x="210" y="2" width="130" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
        <circle cx="222" cy="11" r="3" fill="#10b981"/>
        <text x="232" y="14" font-size="9" font-weight="700" fill="#1e293b">ESP32 Lab Bioquímica</text>
      </g>

      <!-- Simulated Temperature Curve -->
      <path d="M 60 140 Q 180 125, 300 135 T 500 120 T 700 130" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6,4"/>
      <path d="M 60 160 Q 180 150, 300 155 T 500 148 T 700 152" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="8,4"/>
      <!-- Grid ticks -->
      <line x1="50" y1="165" x2="720" y2="165" stroke="#e2e8f0" stroke-width="1"/>
      <text x="20" y="125" font-size="9" fill="#94a3b8" font-family="monospace">-20°C</text>
      <text x="20" y="145" font-size="9" fill="#94a3b8" font-family="monospace">-22°C</text>
      <text x="20" y="165" font-size="9" fill="#94a3b8" font-family="monospace">-24°C</text>
      <text x="180" y="176" font-size="9" fill="#94a3b8">18:10</text>
      <text x="360" y="176" font-size="9" fill="#94a3b8">18:15</text>
      <text x="540" y="176" font-size="9" fill="#94a3b8">18:20</text>
    </g>

    <!-- Bottom Accordions Summary Preview -->
    <g transform="translate(0, 362)">
      <rect x="0" y="0" width="368" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="24" cy="30" r="10" fill="#faf5ff"/>
      <text x="44" y="34" font-size="12" font-weight="700" fill="#581c87">Muestras por Vencer (4)</text>
      <rect x="250" y="20" width="100" height="20" rx="10" fill="#fef3c7"/>
      <text x="300" y="34" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">1 por vencer</text>

      <rect x="388" y="0" width="368" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <circle cx="412" cy="30" r="10" fill="#fef2f2"/>
      <text x="432" y="34" font-size="12" font-weight="700" fill="#991b1b">Alertas Recientes</text>
      <rect x="638" y="20" width="100" height="20" rx="10" fill="#fee2e2"/>
      <text x="688" y="34" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">2 sin resolver</text>
    </g>
  </g>
</svg>
