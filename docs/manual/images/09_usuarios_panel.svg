<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 580" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="uSh" x="-2%" y="-2%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1024" height="580" fill="#f8fafc"/>

  <!-- Main Container -->
  <g transform="translate(30, 20)" filter="url(#uSh)">
    <rect width="964" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Header -->
    <g transform="translate(24, 24)">
      <text font-size="16" font-weight="800" fill="#1e293b" letter-spacing="0.5">GESTIÓN DE USUARIOS DEL SISTEMA</text>
      <text y="18" font-size="11" fill="#64748b">Control de accesos, roles de Administrador General y restablecimiento de credenciales</text>
    </g>

    <!-- Top Stats Cards -->
    <g transform="translate(24, 68)">
      <!-- Card Activos -->
      <g filter="url(#uSh)">
        <rect width="446" height="66" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="18" y="24" font-size="10.5" font-weight="800" fill="#64748b" letter-spacing="0.5">USUARIOS ACTIVOS</text>
        <text x="18" y="52" font-size="24" font-weight="900" fill="#1e293b">12</text>
        <circle cx="410" cy="33" r="18" fill="#e0e7ff"/>
        <!-- UserCheck Icon -->
        <path d="M404 33 l3 3 l7 -7 M400 24 a4 4 0 1 1 8 0 a4 4 0 0 1 -8 0" stroke="#4f46e5" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Card Inactivos -->
      <g transform="translate(470, 0)" filter="url(#uSh)">
        <rect width="446" height="66" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="18" y="24" font-size="10.5" font-weight="800" fill="#64748b" letter-spacing="0.5">USUARIOS INACTIVOS (DESACTIVADOS)</text>
        <text x="18" y="52" font-size="24" font-weight="900" fill="#d97706">2</text>
        <circle cx="410" cy="33" r="18" fill="#fef3c7"/>
        <!-- ShieldAlert Icon -->
        <path d="M410 23 l7 4 v5 c0 5 -7 9 -7 9 s-7 -4 -7 -9 v-5 z M410 29 v3 M410 34 v1" stroke="#d97706" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Table & Search Toolbar -->
    <g transform="translate(24, 150)">
      <rect width="916" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      
      <!-- Toolbar -->
      <g transform="translate(14, 12)">
        <text font-size="12" font-weight="800" fill="#1e293b">LISTA DE USUARIOS ACTIVOS</text>
        <text y="14" font-size="10" fill="#64748b">Usuarios registrados con acceso habilitado al panel</text>

        <!-- Search Input -->
        <g transform="translate(440, -4)">
          <rect width="210" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
          <!-- Search Icon -->
          <circle cx="16" cy="16" r="5" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
          <line x1="20" y1="20" x2="25" y2="25" stroke="#94a3b8" stroke-width="1.5"/>
          <text x="32" y="20" font-size="11" fill="#94a3b8">Buscar por correo...</text>
        </g>

        <!-- Buttons -->
        <g transform="translate(660, -4)">
          <!-- Crear Usuario -->
          <rect width="124" height="32" rx="8" fill="#4f46e5"/>
          <path d="M12 16 h8 M16 12 v8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          <text x="26" y="20" font-size="10.5" font-weight="700" fill="#ffffff">CREAR USUARIO</text>

          <!-- Historial Inactivos -->
          <rect x="132" width="100" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="182" y="20" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">HISTORIAL</text>
        </g>
      </g>
      <line x1="0" y1="56" x2="916" y2="56" stroke="#e2e8f0"/>

      <!-- Table Header -->
      <g transform="translate(0, 56)">
        <rect width="916" height="32" fill="#f1f5f9"/>
        <line x1="0" y1="32" x2="916" y2="32" stroke="#e2e8f0"/>
        <text x="20" y="21" font-size="10.5" font-weight="800" fill="#475569">USUARIO</text>
        <text x="250" y="21" font-size="10.5" font-weight="800" fill="#475569">CORREO ELECTRÓNICO</text>
        <text x="500" y="21" font-size="10.5" font-weight="800" fill="#475569">ROL / NIVEL</text>
        <text x="660" y="21" font-size="10.5" font-weight="800" fill="#475569">ESTADO</text>
        <text x="820" y="21" font-size="10.5" font-weight="800" fill="#475569" text-anchor="end">ACCIONES</text>
      </g>

      <!-- Row 1: Current User (Admin) -->
      <g transform="translate(0, 88)">
        <text x="20" y="26" font-size="12" font-weight="800" fill="#1e293b">Matías Parente</text>
        <rect x="115" y="12" width="28" height="18" rx="4" fill="#dbeafe"/>
        <text x="129" y="24" font-size="9.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Tú</text>

        <text x="250" y="26" font-size="11.5" font-weight="500" fill="#475569">matias.parente@utec.edu.uy</text>
        
        <!-- Role Admin Badge -->
        <g transform="translate(500, 10)">
          <rect width="116" height="24" rx="12" fill="#f3e8ff" stroke="#d8b4fe"/>
          <path d="M10 6 l5 3 v3 c0 4 -5 6 -5 6 s-5 -2 -5 -6 v-3 z" stroke="#7e22ce" stroke-width="1.3" fill="none"/>
          <text x="22" y="16" font-size="10.5" font-weight="800" fill="#6b21a8">Admin General</text>
        </g>

        <!-- Status Activo -->
        <g transform="translate(660, 10)">
          <rect width="64" height="24" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
          <text x="32" y="16" font-size="10.5" font-weight="800" fill="#15803d" text-anchor="middle">Activo</text>
        </g>

        <!-- Actions (Disabled toggle for self) -->
        <g transform="translate(730, 8)">
          <!-- Shield (Disabled) -->
          <rect width="28" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
          <path d="M14 8 l5 3 v3 c0 4 -5 6 -5 6 s-5 -2 -5 -6 v-3 z" stroke="#94a3b8" stroke-width="1.2" fill="none"/>

          <!-- Key (Reset Password) -->
          <rect x="34" width="28" height="28" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
          <circle cx="44" cy="18" r="3" stroke="#4f46e5" stroke-width="1.3" fill="none"/>
          <path d="M47 18 h7 v3 M51 18 v2" stroke="#4f46e5" stroke-width="1.3"/>

          <!-- Trash (Disabled for self) -->
          <rect x="68" width="28" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
          <path d="M76 17 h12 M78 17 v6 M86 17 v6" stroke="#94a3b8" stroke-width="1.3"/>
        </g>
        <line x1="0" y1="44" x2="916" y2="44" stroke="#f1f5f9"/>
      </g>

      <!-- Row 2: Standard User (Operable) -->
      <g transform="translate(0, 132)">
        <text x="20" y="26" font-size="12" font-weight="700" fill="#1e293b">Dra. Sonia Rocha</text>
        <text x="250" y="26" font-size="11.5" font-weight="500" fill="#475569">sonia.rocha@utec.edu.uy</text>
        
        <!-- Role Usuario Badge -->
        <g transform="translate(500, 10)">
          <rect width="84" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
          <circle cx="12" cy="12" r="3" stroke="#475569" stroke-width="1.3" fill="none"/>
          <text x="24" y="16" font-size="10.5" font-weight="700" fill="#334155">Usuario</text>
        </g>

        <!-- Status Activo -->
        <g transform="translate(660, 10)">
          <rect width="64" height="24" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
          <text x="32" y="16" font-size="10.5" font-weight="800" fill="#15803d" text-anchor="middle">Activo</text>
        </g>

        <!-- Actions (Interactive) -->
        <g transform="translate(730, 8)">
          <!-- Shield (Promote to Admin) -->
          <rect width="28" height="28" rx="6" fill="#f3e8ff" stroke="#d8b4fe"/>
          <path d="M14 8 l5 3 v3 c0 4 -5 6 -5 6 s-5 -2 -5 -6 v-3 z" stroke="#7e22ce" stroke-width="1.3" fill="none"/>

          <!-- Key (Reset Password) -->
          <rect x="34" width="28" height="28" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
          <circle cx="44" cy="18" r="3" stroke="#4f46e5" stroke-width="1.3" fill="none"/>
          <path d="M47 18 h7 v3 M51 18 v2" stroke="#4f46e5" stroke-width="1.3"/>

          <!-- Trash (Deactivate user) -->
          <rect x="68" width="28" height="28" rx="6" fill="#fef3c7" stroke="#fde68a"/>
          <path d="M76 17 h12 M78 17 v6 M86 17 v6" stroke="#d97706" stroke-width="1.3"/>
        </g>
        <line x1="0" y1="44" x2="916" y2="44" stroke="#f1f5f9"/>
      </g>

      <!-- Row 3: Otro Usuario -->
      <g transform="translate(0, 176)">
        <text x="20" y="26" font-size="12" font-weight="700" fill="#1e293b">Carlos Cardozo</text>
        <text x="250" y="26" font-size="11.5" font-weight="500" fill="#475569">carlos.cardozo@estudiantes.utec.edu.uy</text>
        
        <g transform="translate(500, 10)">
          <rect width="84" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
          <circle cx="12" cy="12" r="3" stroke="#475569" stroke-width="1.3" fill="none"/>
          <text x="24" y="16" font-size="10.5" font-weight="700" fill="#334155">Usuario</text>
        </g>

        <g transform="translate(660, 10)">
          <rect width="64" height="24" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
          <text x="32" y="16" font-size="10.5" font-weight="800" fill="#15803d" text-anchor="middle">Activo</text>
        </g>

        <g transform="translate(730, 8)">
          <rect width="28" height="28" rx="6" fill="#f3e8ff" stroke="#d8b4fe"/>
          <path d="M14 8 l5 3 v3 c0 4 -5 6 -5 6 s-5 -2 -5 -6 v-3 z" stroke="#7e22ce" stroke-width="1.3" fill="none"/>

          <rect x="34" width="28" height="28" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
          <circle cx="44" cy="18" r="3" stroke="#4f46e5" stroke-width="1.3" fill="none"/>
          <path d="M47 18 h7 v3 M51 18 v2" stroke="#4f46e5" stroke-width="1.3"/>

          <rect x="68" width="28" height="28" rx="6" fill="#fef3c7" stroke="#fde68a"/>
          <path d="M76 17 h12 M78 17 v6 M86 17 v6" stroke="#d97706" stroke-width="1.3"/>
        </g>
      </g>

    </g>
  </g>
</svg>
