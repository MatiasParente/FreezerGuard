<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%" style="background:#f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
  </defs>

  <!-- Background Pattern -->
  <rect width="800" height="520" fill="#f1f5f9"/>
  <circle cx="150" cy="80" r="140" fill="#e0e7ff" opacity="0.6"/>
  <circle cx="700" cy="450" r="160" fill="#ede9fe" opacity="0.6"/>

  <!-- Login Container Card -->
  <g filter="url(#shadow)">
    <rect x="200" y="40" width="400" height="440" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Header / Logo -->
    <g transform="translate(400, 95)" text-anchor="middle">
      <rect x="-24" y="-32" width="48" height="48" rx="12" fill="#4f46e5"/>
      <!-- Snowflake / Shield Icon -->
      <path d="M0 -18 L0 -4 M-10 -14 L0 -7 L10 -14 M-14 0 L-4 0 M-10 -7 L-3 0 L-10 7 M0 4 L0 18 M-10 14 L0 7 L10 14 M4 0 L14 0 M10 -7 L3 0 L10 7" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
      <text y="38" font-size="20" font-weight="700" fill="#1e293b">FreezerGuard</text>
      <text y="56" font-size="12" font-weight="500" fill="#64748b">Sistema de Monitoreo Térmico y Alertas</text>
    </g>

    <!-- Form Fields -->
    <g transform="translate(240, 185)">
      <!-- Email Label & Input -->
      <text x="0" y="0" font-size="12" font-weight="600" fill="#334155">Correo Electrónico</text>
      <rect x="0" y="8" width="320" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="12" y="32" font-size="13" fill="#0f172a">investigador@utec.edu.uy</text>

      <!-- Password Label & Input -->
      <text x="0" y="70" font-size="12" font-weight="600" fill="#334155">Contraseña</text>
      <rect x="0" y="78" width="320" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="18" cy="97" r="3" fill="#334155"/>
      <circle cx="28" cy="97" r="3" fill="#334155"/>
      <circle cx="38" cy="97" r="3" fill="#334155"/>
      <circle cx="48" cy="97" r="3" fill="#334155"/>
      <circle cx="58" cy="97" r="3" fill="#334155"/>
      <circle cx="68" cy="97" r="3" fill="#334155"/>
      <circle cx="78" cy="97" r="3" fill="#334155"/>
      <circle cx="88" cy="97" r="3" fill="#334155"/>

      <!-- Checkbox Recordarme -->
      <g transform="translate(0, 134)">
        <rect x="0" y="0" width="16" height="16" rx="4" fill="#4f46e5"/>
        <path d="M4 8 L7 11 L12 5" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="26" y="13" font-size="13" fill="#475569">Recordarme en este equipo</text>
      </g>

      <!-- Primary Button: Iniciar Sesión -->
      <g transform="translate(0, 175)">
        <rect x="0" y="0" width="320" height="42" rx="10" fill="url(#primaryGrad)"/>
        <text x="160" y="26" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">INICIAR SESIÓN</text>
      </g>

      <!-- Security Notice -->
      <g transform="translate(0, 240)">
        <circle cx="6" cy="6" r="6" fill="#10b981" opacity="0.2"/>
        <circle cx="6" cy="6" r="3" fill="#10b981"/>
        <text x="18" y="9" font-size="11" fill="#64748b">Acceso restringido a personal de laboratorio y docentes</text>
      </g>
    </g>
  </g>
</svg>
