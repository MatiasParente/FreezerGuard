<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow2" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="900" height="360" fill="#f8fafc"/>
  
  <!-- Section Title -->
  <text x="30" y="34" font-size="16" font-weight="800" fill="#0f172a" letter-spacing="0.5">DETALLE DE TARJETAS DE TELEMETRÍA (TOP METRIC CARDS)</text>
  <text x="30" y="52" font-size="12" fill="#64748b">Lectura instantánea del sensor, estado del suministro eléctrico de 220V y canales de notificación activos.</text>

  <!-- CARD 1: TEMPERATURA -->
  <g transform="translate(30, 80)" filter="url(#cardShadow2)">
    <rect x="0" y="0" width="260" height="150" rx="14" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="18" y="28" font-size="11" font-weight="800" fill="#bfdbfe" letter-spacing="1">TEMPERATURA</text>
    
    <text x="18" y="78" font-size="34" font-weight="900" fill="#ffffff" font-family="monospace">-21.40 °C</text>
    <text x="18" y="104" font-size="12" font-weight="600" fill="#dbeafe">ESP32 Lab Central</text>
    
    <rect x="18" y="118" width="120" height="20" rx="5" fill="#1d4ed8"/>
    <text x="78" y="132" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">En Rango Normal</text>
  </g>
  <!-- Card 1 Legend -->
  <g transform="translate(30, 245)">
    <circle cx="6" cy="6" r="4" fill="#2563eb"/>
    <text x="18" y="10" font-size="11" font-weight="700" fill="#1e293b">Temperatura en Tiempo Real</text>
    <text x="18" y="24" font-size="10.5" fill="#475569">Recibida cada 5s desde el ESP32.</text>
    <text x="18" y="38" font-size="10.5" fill="#475569">Si supera el umbral configurado,</text>
    <text x="18" y="52" font-size="10.5" fill="#475569">dispara una alerta inmediata.</text>
  </g>

  <!-- CARD 2: CORRIENTE ELÉCTRICA (COMPARATIVA OK vs CORTE) -->
  <g transform="translate(320, 80)" filter="url(#cardShadow2)">
    <!-- Active OK state -->
    <rect x="0" y="0" width="260" height="150" rx="14" fill="#059669" stroke="#047857" stroke-width="1.5"/>
    <text x="18" y="28" font-size="11" font-weight="800" fill="#a7f3d0" letter-spacing="1">CORRIENTE ELÉCTRICA</text>
    
    <text x="18" y="78" font-size="34" font-weight="900" fill="#ffffff">OK</text>
    <text x="18" y="104" font-size="12" font-weight="600" fill="#d1fae5">Red Eléctrica Activa</text>
    
    <!-- Cut simulation mini-badge -->
    <g transform="translate(18, 116)">
      <rect x="0" y="0" width="224" height="24" rx="6" fill="#dc2626"/>
      <text x="112" y="16" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">MODO CORTE: BATERÍA ACTIVADA</text>
    </g>
  </g>
  <!-- Card 2 Legend -->
  <g transform="translate(320, 245)">
    <circle cx="6" cy="6" r="4" fill="#059669"/>
    <text x="18" y="10" font-size="11" font-weight="700" fill="#1e293b">Detección de Suministro Eléctrico</text>
    <text x="18" y="24" font-size="10.5" fill="#475569"><tspan font-weight="700" fill="#059669">Verde (OK):</tspan> Red eléctrica comercial 220V.</text>
    <text x="18" y="38" font-size="10.5" fill="#475569"><tspan font-weight="700" fill="#dc2626">Rojo (Batería):</tspan> ¡Corte de luz detectado!</text>
    <text x="18" y="52" font-size="10.5" fill="#475569">El ESP32 opera con batería y emite SMS.</text>
  </g>

  <!-- CARD 3: CANALES Y ALERTAS WEB -->
  <g transform="translate(610, 80)" filter="url(#cardShadow2)">
    <rect x="0" y="0" width="260" height="150" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="18" y="28" font-size="11" font-weight="800" fill="#94a3b8" letter-spacing="1">CANALES Y ALERTAS WEB</text>
    
    <!-- Canales Activos -->
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="108" height="22" rx="5" fill="#4f46e5"/>
      <text x="54" y="15" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">Email: ON</text>

      <rect x="116" y="0" width="108" height="22" rx="5" fill="#9333ea"/>
      <text x="170" y="15" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">SMS: ON</text>
    </g>

    <!-- Triggers Configurados -->
    <g transform="translate(18, 76)">
      <rect x="0" y="0" width="42" height="20" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="21" y="14" font-size="9" font-weight="800" fill="#34d399" text-anchor="middle">Temp</text>

      <rect x="46" y="0" width="40" height="20" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="66" y="14" font-size="9" font-weight="800" fill="#34d399" text-anchor="middle">Bat</text>

      <rect x="90" y="0" width="44" height="20" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="112" y="14" font-size="9" font-weight="800" fill="#34d399" text-anchor="middle">Venc</text>

      <rect x="138" y="0" width="42" height="20" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="159" y="14" font-size="9" font-weight="800" fill="#34d399" text-anchor="middle">Inact</text>

      <rect x="184" y="0" width="40" height="20" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4"/>
      <text x="204" y="14" font-size="9" font-weight="800" fill="#34d399" text-anchor="middle">GSM</text>
    </g>

    <!-- Ping Alert Indicator -->
    <g transform="translate(18, 114)">
      <circle cx="8" cy="8" r="5" fill="#ef4444"/>
      <text x="20" y="12" font-size="10" font-weight="700" fill="#f87171">Alarma activa en el sistema</text>
    </g>
  </g>
  <!-- Card 3 Legend -->
  <g transform="translate(610, 245)">
    <circle cx="6" cy="6" r="4" fill="#0f172a"/>
    <text x="18" y="10" font-size="11" font-weight="700" fill="#1e293b">Estado Global de Disparadores</text>
    <text x="18" y="24" font-size="10.5" fill="#475569">Indica qué canales y reglas están activos</text>
    <text x="18" y="38" font-size="10.5" fill="#475569">para alertar (Temperatura, Batería, Vencimiento,</text>
    <text x="18" y="52" font-size="10.5" fill="#475569">Inactividad del sensor y Módem SMS).</text>
  </g>
</svg>
