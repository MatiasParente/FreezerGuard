<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="msh2" x="-2%" y="-2%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1024" height="600" fill="#f8fafc"/>

  <!-- Main Container: Table & Toolbar -->
  <g transform="translate(30, 20)" filter="url(#msh2)">
    <rect width="964" height="560" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Header & Action Buttons -->
    <g transform="translate(24, 24)">
      <text font-size="16" font-weight="800" fill="#1e293b" letter-spacing="0.5">MUESTRAS ALMACENADAS</text>
      <text y="18" font-size="11" fill="#64748b">Control biológico y químico con rangos térmicos y asignación docente</text>

      <!-- Toolbar -->
      <g transform="translate(0, 36)">
        <rect width="916" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
        
        <!-- Filter Freezer -->
        <g transform="translate(14, 10)">
          <rect width="220" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="12" y="20" font-size="11" font-weight="600" fill="#1e293b">Todos los Laboratorios</text>
          <path d="M200 16 L205 21 L210 16" stroke="#64748b" stroke-width="1.5" fill="none"/>
        </g>

        <!-- Right Buttons -->
        <g transform="translate(630, 10)">
          <!-- Button Agregar Muestra -->
          <rect width="144" height="32" rx="8" fill="#4f46e5"/>
          <path d="M16 16 h12 M22 10 v12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
          <text x="36" y="20" font-size="11" font-weight="700" fill="#ffffff">AGREGAR MUESTRA</text>

          <!-- Button Historial Inactivas -->
          <rect x="154" width="120" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
          <path d="M168 16 a6 6 0 1 0 2 -4 M168 12 v4 h4" stroke="#475569" stroke-width="1.5" fill="none"/>
          <text x="180" y="20" font-size="11" font-weight="600" fill="#475569">HISTORIAL</text>
        </g>
      </g>
    </g>

    <!-- Table of Samples -->
    <g transform="translate(24, 130)">
      <rect width="916" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      
      <!-- Table Head -->
      <rect width="916" height="34" rx="10" fill="#f1f5f9"/>
      <rect y="24" width="916" height="10" fill="#f1f5f9"/>
      <line x1="0" y1="34" x2="916" y2="34" stroke="#e2e8f0"/>

      <text x="20" y="22" font-size="10.5" font-weight="800" fill="#475569">MUESTRA</text>
      <text x="250" y="22" font-size="10.5" font-weight="800" fill="#475569">DISPOSITIVO / FREEZER</text>
      <text x="440" y="22" font-size="10.5" font-weight="800" fill="#475569">CANT.</text>
      <text x="500" y="22" font-size="10.5" font-weight="800" fill="#475569">RANGO TEMP.</text>
      <text x="660" y="22" font-size="10.5" font-weight="800" fill="#475569">VENCIMIENTO</text>
      <text x="820" y="22" font-size="10.5" font-weight="800" fill="#475569" text-anchor="end">ACCIONES</text>

      <!-- ROW 1: Con Alerta Activa (Fondo Rojo Pálido) -->
      <g transform="translate(0, 34)">
        <rect width="916" height="48" fill="#fef2f2"/>
        
        <!-- Alert Icon & Title -->
        <circle cx="26" cy="24" r="12" fill="#fee2e2"/>
        <path d="M26 18 v6 M26 27 v1" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
        <text x="48" y="20" font-size="12" font-weight="800" fill="#991b1b">Insulina Recombinante Lote B</text>
        <text x="48" y="34" font-size="10" fill="#dc2626">¡Alerta activa en el freezer asignado!</text>

        <!-- Location -->
        <text x="250" y="28" font-size="11" font-weight="600" fill="#1e293b">ESP32 Lab Central • <tspan fill="#64748b">Freezer Lab 1</tspan></text>
        <text x="440" y="28" font-size="12" font-weight="700" fill="#1e293b">24 viales</text>

        <!-- Temp Range -->
        <text x="500" y="28" font-size="11" font-weight="700" fill="#4f46e5" font-family="monospace">-25.0°C a -18.0°C</text>

        <!-- Expiration -->
        <text x="660" y="28" font-size="11" font-weight="600" fill="#dc2626">16/10/2026 (2 días)</text>

        <!-- Actions -->
        <g transform="translate(770, 10)">
          <!-- Edit -->
          <rect width="28" height="28" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
          <path d="M8 20 l2 -6 l8 -8 l4 4 l-8 8 z" stroke="#4f46e5" stroke-width="1.3" fill="none"/>

          <!-- Deactivate -->
          <rect x="34" width="28" height="28" rx="6" fill="#fef3c7" stroke="#fde68a"/>
          <path d="M42 19 h12 M44 19 v6 M52 19 v6" stroke="#d97706" stroke-width="1.3"/>

          <!-- Chevron Up (Expanded) -->
          <path d="M74 20 L79 15 L84 20" stroke="#475569" stroke-width="2" fill="none"/>
        </g>
        <line x1="0" y1="48" x2="916" y2="48" stroke="#fecaca"/>
      </g>

      <!-- Expanded Row 1 Details -->
      <g transform="translate(0, 82)">
        <rect width="916" height="88" fill="#f8fafc"/>
        <rect width="4" height="88" fill="#4f46e5"/> <!-- Left Indigo accent border -->

        <!-- Column 1: Docentes -->
        <g transform="translate(20, 14)">
          <text font-size="11" font-weight="800" fill="#334155">Docentes Responsables:</text>
          <text y="18" font-size="10.5" fill="#475569">• Dra. Sonia Rocha (srocha@utec.edu.uy)</text>
          <text y="34" font-size="10.5" fill="#475569">• Ing. Marcelo Scotto (mscotto@utec.edu.uy)</text>
        </g>

        <!-- Column 2: Alumnos -->
        <g transform="translate(320, 14)">
          <text font-size="11" font-weight="800" fill="#334155">Alumnos Asignados:</text>
          <text y="18" font-size="10.5" fill="#475569">• Carlos Cardozo</text>
          <text y="34" font-size="10.5" fill="#475569">• Jhon Guimaraens</text>
          <text y="50" font-size="10.5" fill="#475569">• Matías Parente</text>
        </g>

        <!-- Column 3: Observaciones -->
        <g transform="translate(600, 14)">
          <text font-size="11" font-weight="800" fill="#334155">Observaciones del Lote:</text>
          <text y="18" font-size="10.5" fill="#64748b">Conservar estrictamente en gradilla central.</text>
          <text y="32" font-size="10.5" fill="#64748b">No exponer a ciclos repetidos de congelamiento.</text>
        </g>
        <line x1="0" y1="88" x2="916" y2="88" stroke="#e2e8f0"/>
      </g>

      <!-- ROW 2: Muestra Normal -->
      <g transform="translate(0, 170)">
        <circle cx="26" cy="24" r="12" fill="#e0e7ff"/>
        <path d="M23 18 h6 M24 18 v3 L22 26 h8 L28 21 v-3" stroke="#4f46e5" stroke-width="1.3" fill="none"/>
        <text x="48" y="20" font-size="12" font-weight="700" fill="#1e293b">Suero Fetal Bovino</text>
        <text x="48" y="34" font-size="10" fill="#64748b">Frascos de 500ml para cultivo celular</text>

        <text x="250" y="28" font-size="11" font-weight="600" fill="#1e293b">ESP32 Lab Bioquímica • <tspan fill="#64748b">Freezer Lab 2</tspan></text>
        <text x="440" y="28" font-size="12" font-weight="700" fill="#1e293b">10 frascos</text>

        <text x="500" y="28" font-size="11" font-weight="700" fill="#4f46e5" font-family="monospace">-20.0°C a -10.0°C</text>
        <text x="660" y="28" font-size="11" font-weight="600" fill="#16a34a">28/11/2026 (Vigente)</text>

        <!-- Actions -->
        <g transform="translate(770, 10)">
          <rect width="28" height="28" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
          <path d="M8 20 l2 -6 l8 -8 l4 4 l-8 8 z" stroke="#4f46e5" stroke-width="1.3" fill="none"/>

          <rect x="34" width="28" height="28" rx="6" fill="#fef3c7" stroke="#fde68a"/>
          <path d="M42 19 h12 M44 19 v6 M52 19 v6" stroke="#d97706" stroke-width="1.3"/>

          <!-- Chevron Down (Collapsed) -->
          <path d="M74 15 L79 20 L84 15" stroke="#475569" stroke-width="2" fill="none"/>
        </g>
        <line x1="0" y1="48" x2="916" y2="48" stroke="#f1f5f9"/>
      </g>

    </g>
  </g>
</svg>
