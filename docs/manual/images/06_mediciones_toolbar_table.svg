<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="tblSh" x="-2%" y="-2%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="960" height="520" fill="#f8fafc"/>

  <!-- Main Container -->
  <g transform="translate(30, 20)" filter="url(#tblSh)">
    <rect width="900" height="480" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Header -->
    <g transform="translate(24, 24)">
      <text font-size="16" font-weight="800" fill="#1e293b" letter-spacing="0.5">HISTORIAL DE MEDICIONES</text>
      <text y="18" font-size="11" fill="#64748b">Registro cronológico de telemetría térmica y estado del suministro eléctrico</text>
    </g>

    <!-- Filtros Toolbar -->
    <g transform="translate(24, 65)">
      <rect width="852" height="68" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      
      <!-- Filter 1: Suministro Eléctrico -->
      <g transform="translate(16, 12)">
        <text font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">SUMINISTRO ELÉCTRICO</text>
        <rect y="8" width="180" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="12" y="28" font-size="11" font-weight="600" fill="#1e293b">Todos los estados</text>
        <path d="M160 22 L165 27 L170 22" stroke="#64748b" stroke-width="1.5" fill="none"/>
      </g>

      <!-- Filter 2: Dispositivo -->
      <g transform="translate(212, 12)">
        <text font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">DISPOSITIVO</text>
        <rect y="8" width="220" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="12" y="28" font-size="11" font-weight="600" fill="#1e293b">Todos los Dispositivos</text>
        <path d="M200 22 L205 27 L210 22" stroke="#64748b" stroke-width="1.5" fill="none"/>
      </g>

      <!-- Filter 3: Temp Mínima -->
      <g transform="translate(448, 12)">
        <text font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">TEMP. MÍNIMA (°C)</text>
        <rect y="8" width="180" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="12" y="28" font-size="11" fill="#94a3b8">Ej: -25.0</text>
      </g>

      <!-- Filter 4: Temp Máxima -->
      <g transform="translate(644, 12)">
        <text font-size="10" font-weight="700" fill="#475569" letter-spacing="0.5">TEMP. MÁXIMA (°C)</text>
        <rect y="8" width="190" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="12" y="28" font-size="11" fill="#94a3b8">Ej: -10.0</text>
      </g>
    </g>

    <!-- Table Container -->
    <g transform="translate(24, 150)">
      <rect width="852" height="260" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      
      <!-- Table Head -->
      <rect width="852" height="36" rx="10" fill="#f1f5f9"/>
      <rect y="26" width="852" height="10" fill="#f1f5f9"/>
      <line x1="0" y1="36" x2="852" y2="36" stroke="#e2e8f0"/>

      <text x="20" y="23" font-size="11" font-weight="800" fill="#475569" letter-spacing="0.5">FECHA Y HORA</text>
      <text x="200" y="23" font-size="11" font-weight="800" fill="#475569" letter-spacing="0.5">DISPOSITIVO / LABORATORIO</text>
      <text x="460" y="23" font-size="11" font-weight="800" fill="#475569" letter-spacing="0.5">TEMPERATURA</text>
      <text x="610" y="23" font-size="11" font-weight="800" fill="#475569" letter-spacing="0.5">CORRIENTE ELÉCTRICA</text>
      <text x="820" y="23" font-size="11" font-weight="800" fill="#475569" letter-spacing="0.5" text-anchor="end">ACCIONES</text>

      <!-- Row 1: Normal (OK) -->
      <g transform="translate(0, 36)">
        <text x="20" y="28" font-size="11" font-weight="600" fill="#475569" font-family="monospace">14/10/2026, 18:25:20</text>
        <text x="200" y="28" font-size="12" font-weight="600" fill="#1e293b">ESP32 Lab Central <tspan font-weight="400" fill="#64748b">• Freezer Lab 1</tspan></text>
        
        <!-- Temp Badge -->
        <g transform="translate(460, 14)">
          <path d="M4 2 v4 M3 6 a1.5 1.5 0 1 0 2 0" stroke="#4f46e5" stroke-width="1.5" fill="none"/>
          <text x="14" y="11" font-size="12" font-weight="800" fill="#4338ca" font-family="monospace">-21.40 °C</text>
        </g>

        <!-- Power OK Badge -->
        <g transform="translate(610, 12)">
          <rect width="140" height="24" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
          <!-- Zap icon -->
          <path d="M12 7 L8 13 L12 13 L10 17 L16 11 L12 11 Z" fill="#16a34a"/>
          <text x="22" y="16" font-size="10.5" font-weight="700" fill="#15803d">Corriente Eléctrica</text>
        </g>

        <!-- Action Button (Delete) -->
        <g transform="translate(800, 10)">
          <rect width="28" height="28" rx="6" fill="#fef2f2" stroke="#fecaca"/>
          <path d="M8 9 h12 M10 9 v10 M18 9 v10 M11 6 h6" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <line x1="0" y1="44" x2="852" y2="44" stroke="#f1f5f9"/>
      </g>

      <!-- Row 2: CORTE DE LUZ (Batería) -->
      <g transform="translate(0, 80)">
        <text x="20" y="28" font-size="11" font-weight="600" fill="#475569" font-family="monospace">14/10/2026, 18:20:18</text>
        <text x="200" y="28" font-size="12" font-weight="600" fill="#1e293b">ESP32 Lab Central <tspan font-weight="400" fill="#64748b">• Freezer Lab 1</tspan></text>
        
        <!-- Temp Badge -->
        <g transform="translate(460, 14)">
          <path d="M4 2 v4 M3 6 a1.5 1.5 0 1 0 2 0" stroke="#4f46e5" stroke-width="1.5" fill="none"/>
          <text x="14" y="11" font-size="12" font-weight="800" fill="#4338ca" font-family="monospace">-21.20 °C</text>
        </g>

        <!-- Power Batería Badge (Corte Luz) -->
        <g transform="translate(610, 12)">
          <rect width="168" height="24" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
          <!-- Battery icon -->
          <rect x="8" y="7" width="12" height="8" rx="1.5" stroke="#dc2626" stroke-width="1.2" fill="none"/>
          <line x1="21" y1="9" x2="21" y2="13" stroke="#dc2626" stroke-width="1.2"/>
          <rect x="10" y="9" width="4" height="4" fill="#dc2626"/>
          <text x="25" y="16" font-size="10.5" font-weight="800" fill="#991b1b">En Batería (Corte Luz)</text>
        </g>

        <!-- Action Button (Delete) -->
        <g transform="translate(800, 10)">
          <rect width="28" height="28" rx="6" fill="#fef2f2" stroke="#fecaca"/>
          <path d="M8 9 h12 M10 9 v10 M18 9 v10 M11 6 h6" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <line x1="0" y1="44" x2="852" y2="44" stroke="#f1f5f9"/>
      </g>

      <!-- Row 3: Normal -->
      <g transform="translate(0, 124)">
        <text x="20" y="28" font-size="11" font-weight="600" fill="#475569" font-family="monospace">14/10/2026, 18:15:15</text>
        <text x="200" y="28" font-size="12" font-weight="600" fill="#1e293b">ESP32 Lab Bioquímica <tspan font-weight="400" fill="#64748b">• Freezer Lab 2</tspan></text>
        
        <!-- Temp Badge -->
        <g transform="translate(460, 14)">
          <path d="M4 2 v4 M3 6 a1.5 1.5 0 1 0 2 0" stroke="#4f46e5" stroke-width="1.5" fill="none"/>
          <text x="14" y="11" font-size="12" font-weight="800" fill="#4338ca" font-family="monospace">-14.80 °C</text>
        </g>

        <!-- Power OK Badge -->
        <g transform="translate(610, 12)">
          <rect width="140" height="24" rx="12" fill="#dcfce7" stroke="#bbf7d0"/>
          <path d="M12 7 L8 13 L12 13 L10 17 L16 11 L12 11 Z" fill="#16a34a"/>
          <text x="22" y="16" font-size="10.5" font-weight="700" fill="#15803d">Corriente Eléctrica</text>
        </g>

        <!-- Action Button (Delete) -->
        <g transform="translate(800, 10)">
          <rect width="28" height="28" rx="6" fill="#fef2f2" stroke="#fecaca"/>
          <path d="M8 9 h12 M10 9 v10 M18 9 v10 M11 6 h6" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- Pagination Footer -->
    <g transform="translate(24, 430)">
      <text font-size="11" fill="#64748b">Mostrando <tspan font-weight="700" fill="#1e293b">1 a 3</tspan> de <tspan font-weight="700" fill="#1e293b">142</tspan> mediciones registradas</text>
      <g transform="translate(730, -10)">
        <rect width="28" height="28" rx="6" fill="#f1f5f9"/>
        <text x="14" y="18" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">&lt;</text>
        
        <rect x="32" width="28" height="28" rx="6" fill="#4f46e5"/>
        <text x="46" y="18" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
        
        <rect x="64" width="28" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="78" y="18" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">2</text>
        
        <rect x="96" width="28" height="28" rx="6" fill="#f1f5f9"/>
        <text x="110" y="18" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">&gt;</text>
      </g>
    </g>
  </g>
</svg>
